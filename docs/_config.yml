      search_clear: 検索語を消す
      search_no_results: 見つかりませんでした
      search_results_count: "{n} 件"
      toggle_dark: ダークモードに切り替え
      toggle_light: ライトモードに切り替え
      github: GitHub
      toc_title: このページの内容
      breadcrumb_label: 現在の位置
      prev: 前へ
      next: 次へ
      copy: コピー
      copied: コピーしました
      not_found_title: ページが見つかりません
